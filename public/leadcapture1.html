<style>
  :root {
    --z-bg:            #FFFFFF;
    --z-bg-alt:        #F8FAFC;
    --z-surface:       #FFFFFF;
    --z-surface-2:     #F1F5F9;
    --z-border:        #E2E8F0;
    --z-border-strong: #CBD5E1;
    --z-text:          #0F172A;
    --z-text-muted:    #64748B;
    --z-text-soft:     #94A3B8;
    --z-accent:        #7C3AED;
    --z-accent-hover:  #6D28D9;
    --z-accent-soft:   #F3E8FF;
    --z-on-accent:     #FFFFFF;
    --z-dark:          #071A31;
    --z-success:       #059669;
    --z-success-soft:  #ECFDF5;
    --z-success-border:#A7F3D0;
    --z-warn:          #D97706;
    --z-warn-soft:     #FFFBEB;
    --z-warn-border:   #FDE68A;
    --z-danger:        #DC2626;
    --z-danger-soft:   #FEF2F2;
    --z-danger-border: #FECACA;
    --z-radius:        16px;
    --z-radius-sm:     10px;
    --z-shadow-sm:     0 1px 2px rgba(15,23,42,.04);
    --z-shadow:        0 1px 3px rgba(15,23,42,.06), 0 8px 24px -12px rgba(15,23,42,.10);
    --z-shadow-lg:     0 4px 14px rgba(15,23,42,.06), 0 20px 40px -12px rgba(15,23,42,.16);
    color-scheme: light;
  }

  *, *::before, *::after { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0;
    background: var(--z-bg);
    color: var(--z-text);
    font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    line-height: 1.5;
  }
  body {
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  /* --- HEADER & REAL LOGO --- */
  header {
    background: var(--z-dark);
    padding: 16px 20px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    position: sticky;
    top: 0;
    z-index: 50;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }
  .header-inner {
    max-width: 640px; margin: 0 auto;
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .header-logo-link {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    transition: opacity 150ms ease;
  }
  .header-logo-link:hover {
    opacity: 0.9;
  }
  .header-logo {
    display: block;
    height: 32px;
    width: auto;
    max-width: 170px;
    object-fit: contain;
  }
  @media (max-width: 480px) {
    .header-logo { height: 28px; }
  }

  /* --- MAIN CONTAINER --- */
  main {
    max-width: 640px;
    width: 100%;
    margin: 0 auto;
    padding: 44px 20px 72px;
    background: var(--z-bg);
    flex: 1;
  }
  @media (min-width: 640px) {
    main { padding: 60px 24px 88px; }
  }

  /* --- PROFESSIONAL TYPOGRAPHY --- */
  .eyebrow {
    margin: 0 auto 16px;
    font-size: 12px; font-weight: 800;
    letter-spacing: 0.16em; color: var(--z-accent);
    text-transform: uppercase;
    text-align: center;
  }
  .eyebrow-muted { color: var(--z-text-muted); letter-spacing: 0.16em; }

  /* Hero Headline with Clean Editorial Lines */
  .h1 {
    margin: 0 auto;
    max-width: 580px;
    font-size: 32px;
    font-weight: 800;
    line-height: 1.2;
    letter-spacing: -0.035em;
    color: var(--z-text);
    text-align: center;
    text-wrap: balance;
  }
  @media (min-width: 640px) {
    .h1 { font-size: 42px; line-height: 1.16; }
  }
  .h1-line {
    display: block;
  }
  .h1-hl {
    display: block;
    margin-top: 6px;
    color: var(--z-accent);
    background: linear-gradient(135deg, #7C3AED 0%, #6366F1 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  /* Subtitles & Descriptions */
  .h3-sub {
    max-width: 480px;
    margin: 20px auto 0;
    font-size: 17px;
    font-weight: 500;
    line-height: 1.6;
    color: var(--z-text-muted);
    text-align: center;
    text-wrap: balance;
  }
  @media (min-width: 640px) {
    .h3-sub { font-size: 18px; }
  }

  .h2 {
    margin: 0 auto;
    font-size: 24px;
    font-weight: 800;
    line-height: 1.25;
    letter-spacing: -0.025em;
    color: var(--z-text);
    text-align: center;
    text-wrap: balance;
  }
  @media (min-width: 640px) { .h2 { font-size: 28px; } }
  .h2-lg {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1.2;
  }
  @media (min-width: 640px) { .h2-lg { font-size: 34px; line-height: 1.18; } }

  .q-title {
    max-width: 540px;
    margin: 0 auto;
  }

  .body { margin: 0; font-size: 16px; line-height: 1.65; color: var(--z-text); text-align: center; }
  .body-muted {
    margin: 0 auto;
    max-width: 500px;
    font-size: 16px;
    line-height: 1.6;
    color: var(--z-text-muted);
    text-align: center;
    text-wrap: balance;
  }

  /* Micro Trust Indicators */
  .micro-badge-wrap {
    margin-top: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 8px 12px;
    font-size: 13.5px;
    font-weight: 500;
    color: var(--z-text-muted);
    text-align: center;
  }
  .micro-item {
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .micro-icon {
    width: 15px;
    height: 15px;
    color: var(--z-success);
    flex-shrink: 0;
  }
  .micro-dot {
    opacity: 0.4;
  }
  .micro {
    margin: 16px auto 0; text-align: center;
    font-size: 13.5px; color: var(--z-text-muted);
    letter-spacing: 0.01em;
    font-weight: 500;
  }
  .micro strong { color: var(--z-text); font-weight: 700; }

  /* --- CARDS --- */
  .card {
    padding: 24px;
    border-radius: var(--z-radius);
    border: 1px solid var(--z-border);
    background: var(--z-surface);
    box-shadow: var(--z-shadow-sm);
    text-align: center;
  }
  .card-danger { border-color: var(--z-danger-border); background: var(--z-danger-soft); }
  .card-success { border-color: var(--z-success-border); background: var(--z-success-soft); }
  .z-result-preview-card {
    margin-top: 28px;
    background: #F0FDF4;
    border: 1.5px solid #BBF7D0;
    border-radius: 16px;
    padding: 22px 24px;
    text-align: left;
    box-shadow: 0 1px 3px rgba(16, 185, 129, 0.08);
  }
  .z-result-preview-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
  }
  .z-result-preview-badge {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #15803D;
    background: #DCFCE7;
    padding: 3px 8px;
    border-radius: 6px;
    border: 1px solid #86EFAC;
  }
  .z-result-preview-title {
    font-size: 13.5px;
    font-weight: 700;
    color: #166534;
    letter-spacing: -0.01em;
  }
  .z-result-preview-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .z-result-preview-item {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 15.5px;
    line-height: 1.45;
    color: #14532D;
    font-weight: 600;
  }
  .z-check-circle {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #059669;
    color: #FFFFFF;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 1px 3px rgba(5, 150, 105, 0.25);
  }
  .card-label {
    margin: 0 0 14px;
    font-size: 11px; font-weight: 800;
    letter-spacing: 0.16em; text-transform: uppercase;
    text-align: center;
  }

  /* --- MARK LISTS --- */
  .mark-list {
    list-style: none; margin: 0; padding: 0;
    display: flex; flex-direction: column; gap: 14px;
  }
  .mark-list li {
    display: flex; align-items: flex-start; gap: 12px;
    font-size: 15.5px; line-height: 1.5;
    color: var(--z-text);
    font-weight: 500;
    text-align: left;
  }
  .mark-list .x { color: var(--z-danger); font-weight: 800; flex-shrink: 0; font-size: 18px; line-height: 1.2; }
  .mark-list .c { color: var(--z-success); font-weight: 800; flex-shrink: 0; font-size: 18px; line-height: 1.2; }
  .mark-list .num {
    flex-shrink: 0;
    display: grid; place-items: center;
    width: 28px; height: 28px;
    border-radius: 50%;
    border: 1.5px solid var(--z-border-strong);
    font-size: 13.5px; font-weight: 800;
    color: var(--z-text);
    background: var(--z-surface);
  }

  /* --- PERFECTLY ALIGNED CTA BUTTONS --- */
  .cta-wrap {
    max-width: 440px;
    margin: 32px auto 0;
    width: 100%;
    display: flex;
    justify-content: center;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 18px 32px;
    border-radius: 9999px;
    font-family: inherit;
    font-size: 16.5px;
    font-weight: 700;
    line-height: 1.2;
    letter-spacing: -0.01em;
    cursor: pointer;
    text-decoration: none;
    border: 1px solid transparent;
    transition: transform 150ms cubic-bezier(0.16, 1, 0.3, 1),
                background-color 150ms ease,
                box-shadow 150ms ease;
    box-sizing: border-box;
  }
  .btn:focus-visible { outline: 3px solid var(--z-accent); outline-offset: 3px; }
  .btn:disabled { cursor: not-allowed; opacity: 0.55; transform: none !important; }

  .btn-primary {
    background: var(--z-accent);
    color: var(--z-on-accent);
    box-shadow: 0 4px 14px -2px rgba(124,58,237,.35), 0 2px 6px -1px rgba(124,58,237,.2);
  }
  .btn-primary:hover:not(:disabled) {
    background: var(--z-accent-hover);
    transform: translateY(-2px);
    box-shadow: 0 8px 24px -4px rgba(124,58,237,.45), 0 4px 10px -2px rgba(124,58,237,.25);
  }
  .btn-primary:active:not(:disabled) {
    transform: translateY(0);
    box-shadow: 0 2px 8px -2px rgba(124,58,237,.3);
  }

  .btn-ghost {
    background: transparent;
    border-color: var(--z-border);
    color: var(--z-text-muted);
    padding: 18px 24px;
    font-size: 15.5px;
    font-weight: 600;
    border-radius: 9999px;
    width: auto;
  }
  .btn-ghost:hover:not(:disabled) {
    border-color: var(--z-text);
    color: var(--z-text);
    background: var(--z-surface-2);
  }

  .btn-full { width: 100%; }

  .btn-arrow {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
    transition: transform 150ms ease;
  }
  .btn:hover:not(:disabled) .btn-arrow {
    transform: translateX(4px);
  }

  /* --- PROGRESS INDICATOR --- */
  .progress { margin-bottom: 32px; }
  .progress-labels {
    display: flex; justify-content: space-between;
    margin-bottom: 10px;
  }
  .progress-label {
    font-size: 12px; font-weight: 800;
    letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--z-text-muted);
  }
  .progress-pct { font-variant-numeric: tabular-nums; color: var(--z-accent); }
  .progress-bar {
    height: 8px; width: 100%;
    overflow: hidden; border-radius: 999px;
    background: var(--z-surface-2);
  }
  .progress-fill {
    height: 100%; border-radius: 999px;
    background: var(--z-accent);
    transition: width 300ms cubic-bezier(0.16, 1, 0.3, 1);
  }

  /* --- ANSWERS RADIO CARDS --- */
  .answers {
    margin-top: 32px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .answer { display: block; cursor: pointer; }
  .answer-input {
    position: absolute;
    width: 1px; height: 1px;
    opacity: 0; pointer-events: none;
  }
  .answer-body {
    display: flex; align-items: center; gap: 16px;
    padding: 18px 22px;
    border-radius: var(--z-radius);
    border: 2px solid var(--z-border);
    background: var(--z-surface);
    transition: border-color 150ms, background-color 150ms, box-shadow 150ms, transform 150ms;
  }
  .answer:hover .answer-body {
    border-color: var(--z-border-strong);
    box-shadow: var(--z-shadow-sm);
    transform: translateY(-1px);
  }
  .answer-input:checked + .answer-body {
    border-color: var(--z-accent);
    background: var(--z-accent-soft);
    box-shadow: 0 0 0 4px rgba(124,58,237,.14);
  }
  .answer-input:focus-visible + .answer-body {
    outline: 3px solid var(--z-accent); outline-offset: 3px;
  }
  .dot {
    width: 22px; height: 22px;
    flex-shrink: 0; border-radius: 50%;
    border: 2px solid var(--z-border-strong);
    background: var(--z-surface);
    transition: border-color 150ms, background-color 150ms, box-shadow 150ms;
  }
  .answer-input:checked + .answer-body .dot {
    border-color: var(--z-accent);
    background: var(--z-accent);
    box-shadow: inset 0 0 0 4px var(--z-accent-soft);
  }
  .answer-label { font-size: 16.5px; line-height: 1.45; color: var(--z-text); font-weight: 600; text-align: left; }

  /* Question Action Buttons */
  .q-actions {
    margin-top: 36px;
    display: flex; align-items: center; gap: 14px;
    max-width: 520px;
    margin-left: auto;
    margin-right: auto;
  }
  .q-actions .btn-primary { flex: 1; }

  /* --- LEAD CAPTURE FORM --- */
  .fields {
    margin-top: 32px;
    display: flex; flex-direction: column; gap: 18px;
  }
  .field {
    text-align: left;
  }
  .field label {
    display: block; margin-bottom: 8px;
    font-size: 14px; font-weight: 700; letter-spacing: -0.01em;
    color: var(--z-text);
    text-align: left;
  }
  .field .optional {
    margin-left: 5px; opacity: 0.6;
    font-weight: 500; color: var(--z-text-muted);
    font-size: 13px;
  }
  .field input {
    display: block; width: 100%;
    padding: 16px 20px;
    border-radius: 12px;
    border: 1.5px solid var(--z-border);
    background: var(--z-surface);
    color: var(--z-text);
    font-size: 16px; font-family: inherit;
    transition: border-color 150ms, box-shadow 150ms;
    text-align: left;
  }
  .field input::placeholder { color: var(--z-text-soft); }
  .field input:hover { border-color: var(--z-border-strong); }
  .field input:focus {
    outline: none;
    border-color: var(--z-accent);
    box-shadow: 0 0 0 4px rgba(124,58,237,.14);
  }
  .field input[aria-invalid="true"] {
    border-color: var(--z-danger);
    box-shadow: 0 0 0 4px rgba(220,38,38,.14);
  }
  .err { margin: 6px 0 0; font-size: 13px; color: var(--z-danger); font-weight: 600; text-align: left; }
  .err:empty { display: none; }
  .form-err { margin-top: 20px; text-align: center; }

  .space-y > * + * { margin-top: 40px; }

  /* --- RESULTS PRESENTATION --- */
  .risk-card {
    padding: 36px 24px;
    border-radius: var(--z-radius);
    border: 1.5px solid var(--z-border);
    background: var(--z-surface);
    box-shadow: var(--z-shadow-lg);
    text-align: center;
  }
  .risk-card.low { border-color: var(--z-success-border); background: var(--z-success-soft); }
  .risk-card.moderate { border-color: var(--z-warn-border); background: var(--z-warn-soft); }
  .risk-card.high { border-color: var(--z-danger-border); background: var(--z-danger-soft); }

  .risk-label {
    font-size: 12px; font-weight: 800;
    letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--z-text-muted);
    margin: 0 0 12px;
  }
  .risk-level {
    font-size: 36px; font-weight: 900;
    letter-spacing: -0.03em;
    line-height: 1.08;
    margin: 0;
    text-transform: uppercase;
  }
  @media (min-width: 640px) { .risk-level { font-size: 44px; } }
  .risk-level.low { color: var(--z-success); }
  .risk-level.moderate { color: var(--z-warn); }
  .risk-level.high { color: var(--z-danger); }

  .gap-title {
    margin: 0;
    font-size: 24px; font-weight: 800;
    letter-spacing: -0.025em;
    color: var(--z-text);
    text-align: center;
    line-height: 1.25;
    text-wrap: balance;
  }
  @media (min-width: 640px) { .gap-title { font-size: 30px; } }

  .section-divider {
    padding-top: 40px;
    border-top: 1px solid var(--z-border);
    text-align: center;
  }

  .stack > * + * { margin-top: 10px; }

  .anim { animation: fade-up 320ms cubic-bezier(0.16, 1, 0.3, 1) both; }
  @keyframes fade-up {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .anim { animation: none; }
    * { transition-duration: 0.01ms !important; }
  }

  [data-autofocus] { outline: none; }
  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0);
    white-space: nowrap; border: 0;
  }

  /* --- VSL VIDEO --- */
  .vsl {
    position: relative;
    margin-top: 28px;
    border-radius: var(--z-radius);
    border: 1px solid var(--z-border);
    background: var(--z-dark);
    box-shadow: var(--z-shadow-lg);
    overflow: hidden;
    aspect-ratio: 16 / 9;
  }
  .vsl iframe,
  .vsl video {
    display: block;
    width: 100%; height: 100%;
    border: 0;
    object-fit: contain;
    background: #000;
  }
  .vsl-facade {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    width: 100%; height: 100%;
    padding: 0; margin: 0; border: 0;
    background: transparent;
    cursor: pointer;
    font-family: inherit;
    color: #FFF;
  }
  .vsl-poster {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    opacity: .6;
    transition: opacity 150ms;
  }
  .vsl-facade:hover .vsl-poster { opacity: .45; }
  .vsl-poster-fallback {
    background:
      radial-gradient(circle at 50% 45%, rgba(124,58,237,.55), transparent 62%),
      linear-gradient(160deg, #1F2937 0%, #071A31 100%);
    opacity: 1;
  }
  .vsl-facade:hover .vsl-poster-fallback { opacity: 1; }
  .vsl-facade:focus-visible { outline: 3px solid var(--z-accent); outline-offset: -3px; }
  .vsl-play {
    position: relative;
    display: grid; place-items: center;
    width: 76px; height: 76px;
    border-radius: 50%;
    background: var(--z-accent);
    color: #FFF;
    box-shadow: 0 10px 30px -6px rgba(124,58,237,.75), 0 0 0 8px rgba(124,58,237,.18);
    transition: transform 150ms, background-color 150ms, box-shadow 150ms;
  }
  .vsl-facade:hover .vsl-play {
    transform: scale(1.06);
    background: var(--z-accent-hover);
    box-shadow: 0 12px 34px -6px rgba(124,58,237,.85), 0 0 0 12px rgba(124,58,237,.20);
  }
  .vsl-play svg { width: 26px; height: 26px; margin-left: 4px; }
  @media (max-width: 480px) {
    .vsl-play { width: 60px; height: 60px; }
    .vsl-play svg { width: 20px; height: 20px; }
  }

  /* --- CELEBRATION SPLASH --- */
  .celebrate {
    position: fixed;
    inset: 0;
    z-index: 100;
    background:
      radial-gradient(circle at 50% 38%, rgba(124,58,237,0.09), transparent 58%),
      var(--z-bg);
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 48px 20px 64px;
    overflow-y: auto;
    animation: celebrate-in 500ms cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  @keyframes celebrate-in { from { opacity: 0; } to { opacity: 1; } }
  .celebrate-confetti {
    position: fixed;
    inset: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 1;
  }
  .celebrate-inner {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 520px;
    margin: auto 0;
    text-align: center;
    padding: 20px 0;
  }
  .celebrate-badge {
    position: relative;
    width: 100px; height: 100px;
    border-radius: 50%;
    background: var(--z-accent-soft);
    display: grid; place-items: center;
    margin: 0 auto 28px;
    animation: badge-pop 800ms cubic-bezier(0.2, 0.9, 0.3, 1.4) both;
  }
  .celebrate-badge::before {
    content: '';
    position: absolute; inset: -10px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(124,58,237,0.28), transparent 70%);
    animation: badge-glow 2.6s ease-in-out infinite;
    pointer-events: none;
  }
  .celebrate-badge svg { position: relative; width: 54px; height: 54px; }
  .celebrate-check-circle {
    stroke: var(--z-accent);
    stroke-width: 2.5;
    stroke-dasharray: 152;
    stroke-dashoffset: 152;
    animation: draw-circle 800ms 250ms cubic-bezier(0.65, 0, 0.35, 1) both;
  }
  .celebrate-check-mark {
    stroke: var(--z-accent);
    stroke-width: 4;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 40;
    stroke-dashoffset: 40;
    animation: draw-check 450ms 900ms cubic-bezier(0.65, 0, 0.35, 1) both;
  }
  @keyframes badge-pop {
    0%   { transform: scale(0.4); opacity: 0; }
    60%  { transform: scale(1.08); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }
  @keyframes badge-glow {
    0%, 100% { transform: scale(1); opacity: 0.7; }
    50%      { transform: scale(1.2); opacity: 1; }
  }
  @keyframes draw-circle { to { stroke-dashoffset: 0; } }
  @keyframes draw-check  { to { stroke-dashoffset: 0; } }
  .celebrate-eyebrow {
    margin: 0 0 14px;
    font-size: 12px; font-weight: 800;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--z-accent);
    animation: celebrate-up 700ms 500ms cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  .celebrate-title {
    margin: 0 auto;
    max-width: 480px;
    font-size: 32px; font-weight: 800;
    line-height: 1.15; letter-spacing: -0.035em;
    color: var(--z-text);
    text-wrap: balance;
    animation: celebrate-up 700ms 650ms cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  @media (min-width: 640px) { .celebrate-title { font-size: 40px; } }
  .celebrate-sub {
    margin: 18px auto 0;
    max-width: 460px;
    font-size: 16px; line-height: 1.55;
    color: var(--z-text);
    font-weight: 500;
    text-wrap: balance;
    animation: celebrate-up 700ms 850ms cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  .celebrate-body {
    margin: 14px auto 0;
    max-width: 460px;
    font-size: 15px; line-height: 1.65;
    color: var(--z-text-muted);
    text-wrap: balance;
    animation: celebrate-up 700ms 1050ms cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  .celebrate-steps {
    margin-top: 32px;
    display: flex; flex-direction: column;
    gap: 10px;
    text-align: left;
  }
  .celebrate-step {
    display: flex; align-items: flex-start; gap: 14px;
    padding: 16px 18px;
    border-radius: var(--z-radius);
    background: var(--z-bg-alt);
    border: 1px solid var(--z-border);
    animation: celebrate-up 600ms cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  .celebrate-step:nth-child(1) { animation-delay: 1250ms; }
  .celebrate-step:nth-child(2) { animation-delay: 1400ms; }
  .celebrate-step:nth-child(3) { animation-delay: 1550ms; }
  .celebrate-step-num {
    flex-shrink: 0;
    display: grid; place-items: center;
    width: 26px; height: 26px;
    border-radius: 50%;
    background: var(--z-surface);
    border: 1.5px solid var(--z-accent);
    color: var(--z-accent);
    font-size: 12px; font-weight: 800;
    font-variant-numeric: tabular-nums;
  }
  .celebrate-step-text {
    font-size: 15px;
    line-height: 1.5;
    color: var(--z-text);
    font-weight: 500;
  }
  .celebrate-footer {
    margin: 32px 0 0;
    font-size: 14px;
    color: var(--z-text-muted);
    font-weight: 600;
    letter-spacing: 0.01em;
    animation: celebrate-up 700ms 1750ms cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  @keyframes celebrate-up {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .celebrate, .celebrate-badge, .celebrate-badge::before,
    .celebrate-check-circle, .celebrate-check-mark,
    .celebrate-eyebrow, .celebrate-title, .celebrate-sub,
    .celebrate-body, .celebrate-step, .celebrate-footer {
      animation-duration: 0.01ms !important;
      animation-delay: 0ms !important;
    }
    .celebrate-confetti { display: none; }
  }
</style>
</head>

   * SCORING
   * ---------------------------------------------------------------- */

  function calculateResult(answers) {
    var allScored = QUESTIONS.every(function (q) { return typeof answers[q.id] === 'number'; });
    if (!allScored) return null;

    var rawScore = 0;
    var maxPossible = 0;
    var bucketRaw = {};

    for (var i = 0; i < QUESTIONS.length; i++) {
      var q = QUESTIONS[i];
      var idx = answers[q.id];
      var def = q.answers[idx];
      if (!def) return null;
      rawScore += def.score;
      maxPossible += Math.max.apply(null, q.answers.map(function (a) { return a.score; }));
      bucketRaw[q.category] = (bucketRaw[q.category] || 0) + def.score;
    }

    var ratio = rawScore / maxPossible;
    var riskLevel = ratio <= 0.25 ? RISK_LEVELS.LOW
                  : ratio <= 0.55 ? RISK_LEVELS.MODERATE
                  : RISK_LEVELS.HIGH;

    var ranked = CATEGORY_PRIORITY.slice().sort(function (a, b) {
      var ra = bucketRaw[a] || 0;
      var rb = bucketRaw[b] || 0;
      if (rb !== ra) return rb - ra;
      return CATEGORY_PRIORITY.indexOf(a) - CATEGORY_PRIORITY.indexOf(b);
    });

    var topGapKey = ranked[0];
    var topGapScore = bucketRaw[topGapKey] || 0;

    if (typeof answers[Q6.id] === 'number') {
      var q6Cat = Q6.answers[answers[Q6.id]].category;
      var q6Score = bucketRaw[q6Cat] || 0;
      if (q6Score >= topGapScore && q6Score > 0) {
        topGapKey = q6Cat;
        topGapScore = q6Score;
      }
    }

    var topGap = topGapScore > 0 ? GAPS[topGapKey] : null;

    var defaultRecs = ['inventory_sync', 'order_visibility', 'manual_reconciliation'];
    var recKeys;
    if (topGap && defaultRecs.indexOf(topGapKey) !== -1) {
      recKeys = [topGapKey].concat(defaultRecs.filter(function (k) { return k !== topGapKey; }));
    } else if (topGap) {
      recKeys = [topGapKey, defaultRecs[0], defaultRecs[1]];
    } else {
      recKeys = defaultRecs.slice();
    }

    var recommendations = recKeys.map(function (k) {
      return { key: k, title: GAPS[k].fixTitle, body: GAPS[k].fixBody };
    });

    return {
      rawScore: rawScore,
      maxPossible: maxPossible,
      riskLevel: riskLevel,
      biggestGap: topGap ? {
        key: topGapKey,
        name: topGap.name,
        supporting: topGap.supporting,
        couldMean: topGap.couldMean
      } : null,
      consequences: topGap ? topGap.couldMean : [],
      recommendations: recommendations
    };
  }

    var fromUrl = {}, found = false;
    try {
      var params = new URLSearchParams(window.location.search);
      for (var i = 0; i < UTM_KEYS.length; i++) {
        var v = params.get(UTM_KEYS[i]);
        if (v) { fromUrl[UTM_KEYS[i]] = v; found = true; }
      }
      if (found) { sessionStorage.setItem(UTM_STORAGE_KEY, JSON.stringify(fromUrl)); return fromUrl; }
      var stored = sessionStorage.getItem(UTM_STORAGE_KEY);
      if (stored) return JSON.parse(stored);
    } catch (e) {}
    return {};
  }

  function track(event, meta) {

  var EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;

  function normaliseWhatsApp(input) {
    var trimmed = (input || '').trim();
    if (!trimmed) return null;
    var hadPlus = trimmed.charAt(0) === '+';
    var digits = trimmed.replace(/[^\d]/g, '');
    if (!digits) return null;
    if (hadPlus && digits.indexOf('234') !== 0) return (digits.length >= 8 && digits.length <= 15) ? '+' + digits : null;
    if (digits.indexOf('234') === 0) return digits.length === 13 ? '+' + digits : null;
    if (digits.charAt(0) === '0') return digits.length === 11 ? '+234' + digits.slice(1) : null;
    if (digits.length === 10) return '+234' + digits;
    return null;
  }

  function normaliseWebsite(input) {
    var trimmed = (input || '').trim();
    if (!trimmed) return null;
    var withProtocol = /^https?:\/\//i.test(trimmed) ? trimmed : 'https://' + trimmed;
    try {
      var u = new URL(withProtocol);
      if (!u.hostname || u.hostname.indexOf('.') === -1) return null;
      var parts = u.hostname.split('.');
      var tld = parts[parts.length - 1];
      if (!tld || tld.length < 2) return null;
      return u.href.replace(/\/$/, '');
    } catch (e) { return null; }
  }

    var errors = {};

    if (!form.whatsapp || !form.whatsapp.trim()) errors.whatsapp = 'Please enter your WhatsApp number.';
    else if (!normaliseWhatsApp(form.whatsapp)) errors.whatsapp = 'Enter a valid number, e.g. 0801 234 5678.';
    if (!form.email || !form.email.trim()) errors.email = 'Please enter your business email.';
    else if (!EMAIL_RE.test(form.email.trim())) errors.email = 'Enter a valid email address.';
    if (form.website && form.website.trim()) {

    return errors;

  function startCelebrationConfetti() {
    var reduced = false;
    try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
    if (reduced) return;
    var canvas = document.getElementById('celebrate-confetti');
    if (!canvas) return;
    var ctx = canvas.getContext('2d');
    if (!ctx) return;
    var dpr = window.devicePixelRatio || 1;
    var w = window.innerWidth, h = window.innerHeight;
    canvas.width = w * dpr; canvas.height = h * dpr;
    canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
    ctx.scale(dpr, dpr);
    var colors = ['#7C3AED','#6D28D9','#A78BFA','#C4B5FD','#059669','#34D399','#F59E0B','#FCD34D','#F472B6'];
    var particles = [];
    var originX = w * 0.5, originY = h * 0.42;
    for (var i = 0; i < 160; i++) {
      var angle = -Math.PI + Math.random() * Math.PI;
      var speed = 5 + Math.random() * 10;
      particles.push({
        x: originX + (Math.random() - 0.5) * 40,
        y: originY + (Math.random() - 0.5) * 40,
        vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
        gravity: 0.28, drag: 0.985,
        size: 4 + Math.random() * 8,
        rotation: Math.random() * Math.PI * 2,
        vr: (Math.random() - 0.5) * 0.35,
        color: colors[Math.floor(Math.random() * colors.length)],
        life: 1, decay: 0.004 + Math.random() * 0.005,
        shape: Math.random() > 0.55 ? 'rect' : 'circle'
      });
    }
    var startTime = performance.now();
    var maxDuration = 4200;
    function frame(now) {
      var elapsed = now - startTime;
      ctx.clearRect(0, 0, w, h);
      if (elapsed > maxDuration) return;
      for (var i = 0; i < particles.length; i++) {
        var p = particles[i];
        p.vy += p.gravity; p.vx *= p.drag; p.vy *= p.drag;
        p.x += p.vx; p.y += p.vy; p.rotation += p.vr; p.life -= p.decay;
        if (p.life <= 0 || p.y > h + 40) continue;
        ctx.save();
        ctx.globalAlpha = Math.max(0, Math.min(1, p.life));
        ctx.translate(p.x, p.y); ctx.rotate(p.rotation);
        ctx.fillStyle = p.color;
        if (p.shape === 'rect') ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
        else { ctx.beginPath(); ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2); ctx.fill(); }
        ctx.restore();
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

        '<div class="cta-wrap">' +
          '<button type="submit" class="btn btn-primary" id="lead-submit">' +
            '<span>Show My Result</span>' +
            SVG_ARROW +
          '</button>' +
        '</div>' +

        '<p class="micro">We&rsquo;ll use your details to send your result and relevant ZAMERIA information.</p>' +
      '</form>';
  }

  function renderResult(r) {
    var gap = r.biggestGap;

    var consequencesHtml = r.consequences.length
      ? '<ul class="mark-list" style="margin-top:16px">' + r.consequences.map(function (line) {
          return '<li><span class="x" aria-hidden="true">&bull;</span><span>' + esc(line) + '</span></li>';
        }).join('') + '</ul>'
      : '<p class="body-muted" style="margin-top:16px">No specific consequences surfaced from your answers.</p>';

    var recsHtml = r.recommendations.map(function (rec, i) {
      return '' +
        '<li style="align-items:flex-start">' +
          '<span class="num" aria-hidden="true">' + (i + 1) + '</span>' +
          '<div>' +
            '<div style="font-weight:700;color:var(--z-text);font-size:16.5px;line-height:1.4;">' + esc(rec.title) + '</div>' +
            '<div style="color:var(--z-text-muted);font-size:15px;line-height:1.55;margin-top:4px">' + esc(rec.body) + '</div>' +
          '</div>' +
        '</li>';
    }).join('');

    var gapTitle = gap ? gap.name : 'Your stock already knows about both sides';
    var gapSupporting = gap ? gap.supporting : 'Your answers suggest your stock is aware of both your website and your store. The areas below are still worth watching as you grow.';

    return '' +
      '<div class="anim space-y">' +

        '<section>' +
          '<div class="risk-card ' + r.riskLevel.cardClass + '">' +
            '<p class="risk-label">Does your stock know?</p>' +
            '<h2 class="risk-level ' + r.riskLevel.levelClass + '" data-autofocus tabindex="-1">' + esc(r.riskLevel.label) + '</h2>' +
            '<p class="body-muted" style="margin-top:20px">' + esc(r.riskLevel.copy) + '</p>' +
          '</div>' +
        '</section>' +

        '<section class="card card-danger">' +
          '<p class="card-label" style="color:var(--z-danger)">Your Biggest Blind Spot</p>' +
          '<p class="gap-title">' + esc(gapTitle) + '</p>' +
          '<p class="body-muted" style="margin-top:14px">' + esc(gapSupporting) + '</p>' +
        '</section>' +

        '<section>' +
          '<p class="eyebrow eyebrow-muted">What This Is Costing You</p>' +
          consequencesHtml +
        '</section>' +

        '<section>' +
          '<p class="eyebrow eyebrow-muted">What to Fix First</p>' +
          '<ol class="mark-list" style="margin-top:20px">' + recsHtml + '</ol>' +
        '</section>' +

        renderVsl() +

        '<section style="text-align:center;margin-top:32px;">' +
          '<div class="cta-wrap" style="margin-top:0;">' +
            '<button type="button" class="btn btn-primary" data-action="trial">' +
              '<span>Start My 7-Day Free Trial</span>' +
              SVG_ARROW +
            '</button>' +
          '</div>' +
          '<p class="micro">Free for 7 days &bull; No credit card required</p>' +
        '</section>' +

      '</div>';
  }

  function render() {
    var html;

    if (state.step === 'hero') html = renderHero();
    else if (state.step === 'question') html = renderQuestion();
    else if (state.step === 'lead') html = renderLead();
    else if (state.step === 'celebrate') html = renderCelebrate();
    else if (state.step === 'result') {
      var r = calculateResult(state.answers);
      if (r) {
        html = renderResult(r);
        if (!resultsTracked) {
          resultsTracked = true;
          track('stock_awareness_result_viewed', {
            awareness_level: r.riskLevel.key,
            biggest_gap: r.biggestGap ? r.biggestGap.key : null,
            utm_source: state.utm.utm_source,
            utm_campaign: state.utm.utm_campaign
          });
        }
        if (!solutionTracked) {
          solutionTracked = true;
          track('zameria_solution_viewed', {
            awareness_level: r.riskLevel.key,
            biggest_gap: r.biggestGap ? r.biggestGap.key : null,
            utm_source: state.utm.utm_source,
            utm_campaign: state.utm.utm_campaign
          });
        }
      } else {
        html = '<div class="anim" style="text-align:center;"><h2 class="h2 h2-lg">We couldn&rsquo;t load your result.</h2>' +
               '<p class="body-muted" style="margin-top:16px">Please retake the check. It only takes about 30 seconds.</p>' +
               '<div class="cta-wrap" style="margin-top:32px"><button type="button" class="btn btn-primary" data-action="restart"><span>Start again</span> ' + SVG_ARROW + '</button></div></div>';
      }
    } else html = renderHero();

    app.innerHTML = html;

    if (state.step === 'celebrate') {
      try { startCelebrationConfetti(); } catch (e) {}
    }

    var autofocus = app.querySelector('[data-autofocus]');
    if (autofocus && typeof autofocus.focus === 'function') {
      try { autofocus.focus({ preventScroll: true }); } catch (e) { autofocus.focus(); }
    }
    window.scrollTo(0, 0);
  }

  function goTo(step) {
    state.step = step;
    savePersistedState(state);
    render();
  }

  function goToQuestion(index) {
    state.step = 'question';
    state.qIndex = index;
    savePersistedState(state);
    render();
  }

  /* ---------------------------------------------------------------- *
   * HANDLERS
   * ---------------------------------------------------------------- */

  function handleStart() {
    track('stock_awareness_started', {
      utm_source: state.utm.utm_source,
      utm_campaign: state.utm.utm_campaign
    });
    goToQuestion(0);
  }

  function handleAnswer(qid, answerIndex) {
    state.answers[qid] = answerIndex;
    savePersistedState(state);

    var q = null;
    var isPersonalisation = false;
    for (var i = 0; i < QUESTIONS.length; i++) if (QUESTIONS[i].id === qid) { q = QUESTIONS[i]; break; }
    if (!q && qid === Q6.id) { q = Q6; isPersonalisation = true; }
    if (!q) return;

    track('stock_awareness_question_answered', {
      question_number: q.number,
      question_id: q.id,
      category: isPersonalisation ? q.answers[answerIndex].category : q.category,
      answer: q.answers[answerIndex].label,
      answer_index: answerIndex,
      utm_source: state.utm.utm_source,
      utm_campaign: state.utm.utm_campaign
    });

    var nextBtn = app.querySelector('[data-action="next"]');
    if (nextBtn) nextBtn.disabled = false;
  }

  function handleNext() {
    var q = getQuestionByIndex(state.qIndex);
    if (typeof state.answers[q.id] !== 'number') return;

    if (state.qIndex < TOTAL_QUESTIONS - 1) {
      goToQuestion(state.qIndex + 1);
      return;
    }

    var r = calculateResult(state.answers);
    track('stock_awareness_completed', {
      awareness_level: r ? r.riskLevel.key : null,
      biggest_gap: r && r.biggestGap ? r.biggestGap.key : null,
      utm_source: state.utm.utm_source,
      utm_campaign: state.utm.utm_campaign
    });
    track('lead_form_viewed', {
      utm_source: state.utm.utm_source,
      utm_campaign: state.utm.utm_campaign
    });

    goTo('lead');
  }

  function handleBack() {
    if (state.qIndex > 0) goToQuestion(state.qIndex - 1);
    else goTo('hero');
  }

  function showFieldErrors(errors) {
    var slots = app.querySelectorAll('[data-err]');
    for (var i = 0; i < slots.length; i++) {
      var key = slots[i].getAttribute('data-err');
      slots[i].textContent = errors[key] || '';
    }
    var inputs = app.querySelectorAll('.field input');
    for (var j = 0; j < inputs.length; j++) {
      var name = inputs[j].getAttribute('name');
      if (errors[name]) inputs[j].setAttribute('aria-invalid', 'true');
      else inputs[j].removeAttribute('aria-invalid');
    }
  }

  function handleSubmit(e) {
    e.preventDefault();
    var form = e.target;
    var data = {
      fullName: (form.fullName.value || '').trim(),
      whatsapp: (form.whatsapp.value || '').trim(),
      email: (form.email.value || '').trim(),
      website: (form.website.value || '').trim()
    };

    var errors = validateLead(data);
    showFieldErrors(errors);
    if (Object.keys(errors).length > 0) {
      var firstKey = Object.keys(errors)[0];
      var firstInput = form.querySelector('#' + firstKey);
      if (firstInput) firstInput.focus();
      return;
    }

    var r = calculateResult(state.answers);
    if (!r) {
      var formErr = app.querySelector('[data-err="form"]');
      if (formErr) formErr.textContent = 'Something went wrong calculating your result. Please try again.';
      return;
    }

    var submitBtn = document.getElementById('lead-submit');
    if (submitBtn) { submitBtn.disabled = true; submitBtn.innerHTML = '<span>Submitting&hellip;</span>'; }

    var payload = {
      fullName: data.fullName,
      whatsapp: normaliseWhatsApp(data.whatsapp) || data.whatsapp,
      email: data.email.toLowerCase(),
      website: data.website ? normaliseWebsite(data.website) : null,
      answers: QUESTIONS.map(function (q) {
        var idx = state.answers[q.id];
        return {
          questionId: q.id,
          questionNumber: q.number,
          category: q.category,
          answerLabel: q.answers[idx].label,
          answerIndex: idx,
          score: q.answers[idx].score
        };
      }).concat([
        (function () {
          var idx = state.answers[Q6.id];
          if (typeof idx !== 'number') return null;
          return {
            questionId: Q6.id,
            questionNumber: Q6.number,
            category: Q6.answers[idx].category,
            answerLabel: Q6.answers[idx].label,
            answerIndex: idx,
            score: null
          };
        })()
      ].filter(Boolean)),
      awarenessLevel: r.riskLevel.key,
      biggestGap: r.biggestGap ? r.biggestGap.key : null,
      utm: state.utm,
      campaign: 'stock_awareness_check',
      meta: {
        submittedAt: new Date().toISOString(),
        pageUrl: window.location.href,
        referrer: document.referrer || ''
      }
    };

    submitLead(payload).then(function () {
      track('lead_submitted', {
        awareness_level: r.riskLevel.key,
        biggest_gap: r.biggestGap ? r.biggestGap.key : null,
        utm_source: state.utm.utm_source,
        utm_campaign: state.utm.utm_campaign
      });
      clearPersistedState();
      goTo('result');
    }).catch(function (err) {
      console.error('[ZAMERIA] Lead submission error:', err);
      var formErr = app.querySelector('[data-err="form"]');
      if (formErr) formErr.textContent = 'We couldn’t submit your result yet. Please check your connection and try again.';
      if (submitBtn) { submitBtn.disabled = false; submitBtn.innerHTML = '<span>Show My Result</span> ' + SVG_ARROW; }
    });
  }

  function handleRestart() {
    state.step = 'hero';
    state.qIndex = 0;
    state.answers = {};
    resultsTracked = false;
    solutionTracked = false;
    clearPersistedState();
    render();
  }

  /* ---------------------------------------------------------------- *
   * EVENTS
   * ---------------------------------------------------------------- */

  app.addEventListener('click', function (e) {
    var target = e.target.closest ? e.target.closest('[data-action]') : null;
    if (!target) return;
    var action = target.getAttribute('data-action');

    if (action === 'start') handleStart();
    else if (action === 'next') handleNext();
    else if (action === 'back') handleBack();
    else if (action === 'restart') handleRestart();
    else if (action === 'play-vsl') handlePlayVsl();
    else if (action === 'trial') {
      var r = calculateResult(state.answers);
      track('trial_cta_clicked', {
        awareness_level: r ? r.riskLevel.key : null,
        biggest_gap: r && r.biggestGap ? r.biggestGap.key : null,
        utm_source: state.utm.utm_source,
        utm_campaign: state.utm.utm_campaign
      });
      goTo('celebrate');
    }
  });

  app.addEventListener('change', function (e) {
    var t = e.target;
    if (t && t.matches && t.matches('input[type="radio"][name]')) {
      handleAnswer(t.getAttribute('name'), parseInt(t.value, 10));
    }
  });

  app.addEventListener('submit', function (e) {
    if (e.target && e.target.id === 'lead-form') handleSubmit(e);
  });

  render();

})();
</script>

</body>
</html>
